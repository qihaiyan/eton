# Build eton.exe and an MSI installer only when a GitHub Release is published,
# or when triggered manually from the Actions tab. Both files are signed when
# a code signing certificate is configured (secrets CODESIGN_PFX_B64 /
# CODESIGN_PFX_PASSWORD) and are attached to the release as assets.
#
# Signing options that work with this workflow as-is:
#   Any certificate you can export as a PFX (base64 into CODESIGN_PFX_B64).
# For cloud-based signing (new certs are hardware-bound since June 2023 and
# cannot be exported as PFX), swap the sign steps for the vendor's action,
# e.g. Microsoft Trusted Signing: Microsoft/trusted-signing-action@v0
#
# Version: release tag v1.2.3 / 1.2.3 -> MSI ProductVersion 1.2.3;
#          manual dispatch           -> 0.0.<run number>
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Sets up MSVC + Windows SDK in PATH (also makes signtool available)
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Determine version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME#v}" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Generate version header
        shell: bash
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH="${PATCH%%.*}"
          cat > src/version.h <<EOF
          #define ET_VERSION_MAJOR ${MAJOR:-0}
          #define ET_VERSION_MINOR ${MINOR:-0}
          #define ET_VERSION_PATCH ${PATCH:-0}
          #define ET_VERSION_STR   "$VERSION"
          EOF

      - name: Build
        shell: cmd
        run: build.bat auto

      - name: Check for signing certificate
        id: cert
        shell: bash
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
        run: 'echo "exists=$([ -n "$PFX_B64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"'

      - name: Decode certificate
        if: steps.cert.outputs.exists == 'true'
        shell: bash
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
        run: printf '%s' "$PFX_B64" | base64 -d > codesign.pfx

      - name: Sign eton.exe
        if: steps.cert.outputs.exists == 'true'
        shell: cmd
        env:
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: signtool sign /nologo /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f codesign.pfx /p "%PFX_PASSWORD%" eton.exe

      - name: Verify exe signature
        if: steps.cert.outputs.exists == 'true'
        shell: cmd
        run: signtool verify /pa /all eton.exe

      - name: Build MSI installer
        shell: cmd
        run: |
          dotnet tool install --global wix
          "%USERPROFILE%\.dotnet\tools\wix.exe" build -arch x64 eton.wxs -d Version=%VERSION% -acceptEula wix7 -o eton-%VERSION%-x64.msi

      - name: Sign MSI
        if: steps.cert.outputs.exists == 'true'
        shell: cmd
        env:
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: signtool sign /nologo /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f codesign.pfx /p "%PFX_PASSWORD%" "eton-%VERSION%-x64.msi"

      - name: Verify MSI signature
        if: steps.cert.outputs.exists == 'true'
        shell: cmd
        run: signtool verify /pa "eton-%VERSION%-x64.msi"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eton-windows-x64
          path: |
            eton.exe
            eton-*-x64.msi
          if-no-files-found: error

      - name: Attach files to the release
        if: github.event_name == 'release'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "%GITHUB_REF_NAME%" eton.exe "eton-%VERSION%-x64.msi" --clobber
