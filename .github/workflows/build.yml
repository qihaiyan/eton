# Build eton.exe only when a GitHub Release is published, or when triggered
# manually from the Actions tab. The binary is signed when a code signing
# certificate is configured (secrets CODESIGN_PFX_B64 / CODESIGN_PFX_PASSWORD)
# and is attached to the release as an asset.
#
# Signing options that work with this workflow as-is:
#   Any certificate you can export as a PFX (base64 into CODESIGN_PFX_B64).
# For cloud-based signing (new certs are hardware-bound since June 2023 and
# cannot be exported as PFX), swap the sign step for the vendor's action,
# e.g. Microsoft Trusted Signing: Microsoft/trusted-signing-action@v0
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Sets up MSVC + Windows SDK in PATH (also makes signtool available)
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: build.bat auto

      - name: Check for signing certificate
        id: cert
        shell: bash
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
        run: 'echo "exists=$([ -n "$PFX_B64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"'

      - name: Decode certificate
        if: steps.cert.outputs.exists == 'true'
        shell: bash
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
        run: printf '%s' "$PFX_B64" | base64 -d > codesign.pfx

      - name: Sign eton.exe
        if: steps.cert.outputs.exists == 'true'
        shell: cmd
        env:
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: signtool sign /nologo /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f codesign.pfx /p "%PFX_PASSWORD%" eton.exe

      - name: Verify signature
        if: steps.cert.outputs.exists == 'true'
        shell: cmd
        run: signtool verify /pa /all eton.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eton-windows-x64
          path: eton.exe
          if-no-files-found: error

      - name: Attach binary to the release
        if: github.event_name == 'release'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "%GITHUB_REF_NAME%" eton.exe --clobber
